<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Neon Galaxy Stream Widget</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            /* 配信用のプレビューとして背景をつけています（OBSでは透明になります） */
            background: radial-gradient(circle at center, #1b0f2e 0%, #0a0512 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        /* 横長でスリムなネオンコンテナ枠 */
        .journey-container {
            position: relative;
            width: 580px;
            padding: 20px 25px;
            background: rgba(15, 8, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #b026ff;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(176, 38, 255, 0.5),
                        inset 0 0 15px rgba(176, 38, 255, 0.2);
            text-align: center;
            z-index: 10;
        }

        /* 横長のルートバーエリア */
        .space-route-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 15px 0;
            position: relative;
        }

        .current-origin {
            font-size: 28px;
            filter: drop-shadow(0 0 8px #ff71ce);
            margin-right: 12px;
        }

        .next-goal {
            font-size: 32px;
            filter: drop-shadow(0 0 10px #01cdfe);
            margin-left: 12px;
            transition: transform 0.2s ease;
        }

        .next-goal.pop {
            transform: scale(1.2);
        }

        /* ピンクネオンの横長バー枠 */
        .route-bar-bg {
            flex-grow: 1;
            height: 14px;
            background: #0d0618;
            border-radius: 7px;
            border: 1px solid #ff71ce;
            box-shadow: inset 0 0 8px rgba(255, 113, 206, 0.4),
                        0 0 6px rgba(255, 113, 206, 0.4);
            position: relative;
            overflow: visible;
        }

        .route-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #01cdfe, #b026ff, #ff71ce);
            border-radius: 6px;
            box-shadow: 0 0 10px #ff71ce, 0 0 5px #01cdfe;
            transition: width 0.1s ease-out;
        }

        /* 🚀 ロケット：バーにちょい下から被さる位置 */
        .traveling-rocket {
            position: absolute;
            top: -8px;
            left: 0%;
            font-size: 24px;
            transform: translateX(-50%);
            transition: left 0.1s ease-out;
            filter: drop-shadow(0 0 8px #ff71ce);
            z-index: 5;
        }

        .traveling-rocket.jump {
            transform: translateX(-50%) scale(1.3) rotate(15deg);
        }

        /* 水色の数字・カウンター */
        .info-area {
            display: flex;
            justify-content: space-between;
            color: #01cdfe;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 0 6px #01cdfe;
            border-top: 1px dashed rgba(1, 205, 254, 0.3);
            padding-top: 10px;
        }

        /* タップしたときのスパーク */
        .spark {
            position: absolute;
            font-size: 16px;
            pointer-events: none;
            animation: spark-anim 0.6s ease-out forwards;
            z-index: 999;
        }

        @keyframes spark-anim {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
                filter: drop-shadow(0 0 10px #b026ff);
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(180deg);
                opacity: 0;
                filter: drop-shadow(0 0 3px #01cdfe);
            }
        }
    </style>
</head>
<body>

    <div class="journey-container">
        <div class="space-route-wrapper">
            <div class="current-origin" id="originIcon">☀️</div>
           
            <div class="route-bar-bg">
                <div class="route-bar-fill" id="routeFill"></div>
                <div class="traveling-rocket" id="travelingRocket">🚀</div>
            </div>

            <div class="next-goal" id="goalIcon">☄️</div>
        </div>

        <div class="info-area">
            <span id="progressText">0 / 1,000 TAP</span>
            <span id="percentText">0.0%</span>
        </div>
    </div>

    <script>
        const originIcon = document.getElementById('originIcon');
        const goalIcon = document.getElementById('goalIcon');
        const routeFill = document.getElementById('routeFill');
        const travelingRocket = document.getElementById('travelingRocket');
        const progressText = document.getElementById('progressText');
        const percentText = document.getElementById('percentText');

        const celestialBodies = ["☀️", "☄️", "✨", "🌍", "🌙", "🔴", "🪐", "💫", "🔵", "🌀"];

        let totalTaps = 0;
        const goalTotalTaps = 1000; // テスト用1Kゴール
        const totalStages = celestialBodies.length - 1;
        const stageInterval = goalTotalTaps / totalStages;

        document.addEventListener('click', (e) => {
            if (totalTaps < goalTotalTaps) {
                totalTaps += 1; // 💡 サクサク進めたいときは「+ 50」などに変えてね！
            }

            travelingRocket.classList.add('jump');
            setTimeout(() => {
                travelingRocket.classList.remove('jump');
            }, 120);

            updateUI();
            createSparks(e.clientX, e.clientY);
        });

        function updateUI() {
            let currentStageIndex = Math.floor(totalTaps / stageInterval);
            if (currentStageIndex >= totalStages) {
                currentStageIndex = totalStages - 1;
            }

            originIcon.innerText = celestialBodies[currentStageIndex];
            goalIcon.innerText = celestialBodies[currentStageIndex + 1];

            const stageStartTaps = currentStageIndex * stageInterval;
            const currentStageProgress = totalTaps - stageStartTaps;
            const stagePercentage = (currentStageProgress / stageInterval) * 100;
           
            if (totalTaps >= goalTotalTaps) {
                originIcon.innerText = "🔵";
                goalIcon.innerText = "🌀";
            }

            routeFill.style.width = stagePercentage + '%';
            travelingRocket.style.left = stagePercentage + '%';

            const totalPercentage = (totalTaps / goalTotalTaps) * 100;
            progressText.innerText = `${totalTaps.toLocaleString()} / ${goalTotalTaps.toLocaleString()} TAP`;
            percentText.innerText = `${totalPercentage.toFixed(1)}%`;
        }

        function createSparks(x, y) {
            const symbols = ['✨', '⭐', '💫', '✦'];
            for (let i = 0; i < 3; i++) {
                const spark = document.createElement('div');
                spark.classList.add('spark');
                spark.innerText = symbols[Math.floor(Math.random() * symbols.length)];
               
                spark.style.left = x + 'px';
                spark.style.top = y + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 50;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                spark.style.setProperty('--dx', dx + 'px');
                spark.style.setProperty('--dy', dy + 'px');

                document.body.appendChild(spark);

                setTimeout(() => {
                    spark.remove();
                }, 600);
            }
        }

        updateUI();
    </script>
</body>
</html>
